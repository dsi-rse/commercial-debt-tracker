# PR quality gate. Thin caller of the shared composition pipeline-checks.yml
# (lint, test, security, pulumi preview), pinned to an exact release of
# dsi-rse/idi-ftm2j-shared. Bump the @vX.Y.Z pin to upgrade.
#
# No paths-ignore here: the four job names are required checks on the dev and
# main rulesets, and a skipped required check never reports, so a docs-only PR
# would sit unmergeable.
name: Checks

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write          # OIDC for the pulumi preview role
  security-events: write   # CodeQL upload

jobs:
  checks:
    uses: dsi-rse/idi-ftm2j-shared/.github/workflows/pipeline-checks.yml@v0.1.19
    secrets: inherit
    with:
      app-name: cdt
      # The importable package is plain `cdt`, not `idi_cdt` — off-convention,
      # but it is the name --cov has to be given to measure anything.
      cov-package: cdt
