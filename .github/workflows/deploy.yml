name: Deploy

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cdt-orchestrator

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.orchestrator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pulumi:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      id-token: write
      contents: read
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: "3.13"
      - name: Install Pulumi dependencies
        run: uv sync --group pulumi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEPLOY }}
          role-session-name: idi-github-ci
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}
      - name: Pulumi up
        run: |
          cd pulumi
          pulumi login s3://${{ secrets.PULUMI_STATE_BUCKET }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pulumi stack select prod 2>/dev/null || pulumi stack init prod
          else
            pulumi stack select dev 2>/dev/null || pulumi stack init dev
          fi
          uv run pulumi up --yes

  ecr-sync:
    runs-on: ubuntu-latest
    needs: [docker, pulumi]
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          python-version: "3.13"
      - name: Install Pulumi dependencies
        run: uv sync --group pulumi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEPLOY }}
          role-session-name: idi-github-ci
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Pulumi backend
        run: pulumi login s3://${{ secrets.PULUMI_STATE_BUCKET }}
        working-directory: pulumi
      - name: Select Pulumi stack
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pulumi stack select prod
          else
            pulumi stack select dev
          fi
        working-directory: pulumi
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Sync GHCR image to ECR
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
        run: |
          ECR_IMAGE="$(pulumi stack output ecr_repo_url):latest"
          ECR_SHA_IMAGE="$(pulumi stack output ecr_repo_url):${GITHUB_SHA}"
          docker pull "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "$ECR_IMAGE"
          docker tag "$GHCR_IMAGE" "$ECR_SHA_IMAGE"
          docker push "$ECR_IMAGE"
          docker push "$ECR_SHA_IMAGE"
        working-directory: pulumi
