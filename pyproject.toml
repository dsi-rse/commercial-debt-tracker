[build-system]
requires = ["setuptools >= 64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-debt-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  # project packages
  "boto3~=1.35",
  "defusedxml~=0.7",
  "idi-ftm2j-shared>=0.1.4",
  "numpy~=2.2",
  "openai~=1.0",
  "openrouter",
  "pandas~=2.2",
  "pycountry~=24.6",
  "pyarrow>=22.0",
  "scikit-learn~=1.5",
  "tiktoken~=0.8",
  
  "python-dotenv~=1.2",
  
]

[project.scripts]
cdt = "cdt.cli:main"
cdt-orchestrator = "cdt.orchestrator:main"

[dependency-groups]
dev = [
  "ruff==0.7.2",
  "pre-commit~=3.5",
  "coverage~=7.3",
  "pytest>=9.0.3",
  "pytest-cov~=7.0",
  "jupyterlab>=4.5.10,<5",
  "ipykernel~=6.16",
]
pulumi = [
  "pip>=26.1.2",
  "pulumi>=3.0,<4.0",
  "pulumi-aws>=6.0,<7.0",
]



[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
extend-select = [
  # by default, ruff enables all F and a subset of E rules
  # for a description of rulesets and examples, see:
  # https://docs.astral.sh/ruff/rules/
  "ANN",    # flake8-annotations - type annotations, some ignored
  "B",      # bugbear - identifies likely bugs
  "C4",     # flake8-comprehensions - identifies redundant calls in comprehensions
  "D",      # pydocstyle - requires docstrings on all public modules/functions/classes
  "I",      # isort
  "N801",   # pep8-naming - enforce ClassNamesStyle
  "N804",   # pep8-naming - first arg of classmethod should be cls
  "N805",   # pep8-naming - first arg of method should be self
  "PD",     # pandas-vet
  "PLR2004",# Pylint no magic values!
  "PTH",    # prefer pathlib over os.path as seems to be the consensus
  "Q",      # flake8-quotes - double quotes preferred (like black)
  "S",      # flake8-bandit - security checks
  "UP",     # pyupgrade - requires preferred syntax in newer python versions
  "YTT",    # flake8-2020 - corrects code that doesn't anticipate 2 digit python minor version  
]

ignore = [
  "D415",   # allow first line of doctstrings to end without punctuation
  "ANN002", # missing type on *args
  "ANN003", # missing type on **kwargs
  "B905",   # won't work on python <3.10
  "S101",   # allow assertions
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
python_files = "test_*.py"
# CI runs a bare `uv run pytest --cov=...` with no path argument, so testpaths is
# what selects collection. `src/cdt/sixk` is listed so `--doctest-modules` runs
# the doctests there; they are the clearest statement of intent in that package
# and would otherwise rot unexecuted. Scoped rather than repo-wide because
# --doctest-modules imports every module it collects, and much of `src/cdt`
# reaches for AWS clients on import.
testpaths = ["tests", "src/cdt/sixk"]
addopts = "--doctest-modules"

[tool.uv.sources]
idi-ftm2j-shared = { git = "https://github.com/dsi-rse/idi-ftm2j-shared.git", rev = "v0.1.4" }

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = ["PLR2004"]
