# Committed variable config for the dev stack. The processor bucket and scheduler
# DLQ are read from SSM (/idi/dev/shared/*), so they are NOT set here; the paths
# below are bucket-relative keys resolved against that shared bucket.
config:
  aws:region: us-east-2
  idi:artifact_prefix: processors/cdt
  idi:final_database_prefix: database/cdt
  # Filers a run covers when no --cik-file is given: "all", or a bucket-relative
  # CIK file. The beta scope is the 54 important 8-K filers
  # (data/important-8K-filers.csv). Dev stays on a beta list after launch, as
  # the cheap test stack.
  idi:cik_scope: processors/cdt/inputs/ciks/important-8K-filers.txt
  idi:cpu: "1024"
  idi:memory: "4096"
  idi:ecr_image_retention_count: "5"
  idi:cron: cron(0 7 * * ? *)
  idi:schedule_enabled: "false"
  # The poller alone drives batch extraction, so manual historical runs drain
  # without hand-fired ticks while the daily schedule stays off. Off while the
  # dev root is rebuilt for the step 4 formats (docs/deployment.md, "When a
  # stored format changes"); set "true" again to drain the rebuild.
  idi:poll_schedule_enabled: "false"
  # Where every alarm notifies. Alerts stay off until the deploy role gains the
  # sns/cloudwatch/events statements from dsi-rse/idi-ftm2j-shared#79 — flipping
  # alerts_enabled before that redeploy fails with AccessDenied on CreateTopic.
  # Once it lands, uncomment the line below; nothing else is needed.
  idi:alert_email: tspread@uchicago.edu
  # idi:alerts_enabled: "true"
